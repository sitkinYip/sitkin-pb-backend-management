name: PocketBase backend CI
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/game-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/game-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download pinned Linux runtime
        working-directory: backend
        run: node scripts/prepare-runtime.mjs amd64
      - name: Build isolated backend image
        working-directory: backend
        run: docker build --platform linux/amd64 -f deploy/Dockerfile -t questions-pocketbase:ci .
      - name: Real backend integration tests
        env:
          PB_DOCKER_IMAGE: questions-pocketbase:ci
        run: node --test backend/tests/*.test.mjs
      - name: Image and restore rehearsal
        working-directory: backend
        env:
          PB_DOCKER_IMAGE: questions-pocketbase:ci
        run: node scripts/verify-image.mjs
