name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: questions-admin-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_POCKET_BASE_HOST: ${{ vars.QUESTIONS_POCKETBASE_URL || 'https://api.sitkin.top' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test admin authentication and routing
        run: pnpm test:admin

      - name: Check this repository's generated contracts
        run: pnpm check:contracts --admin-only

      - name: Check backend API compatibility (read-only)
        run: node backend/scripts/verify-deployment.mjs

      - name: Build project
        run: pnpm build

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/*"
          target: ${{ secrets.SERVER_PATH }}
          strip_components: 1
